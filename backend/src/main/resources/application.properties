spring.application.name=blockchain-cert-system
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cert_verify_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:MyVerySecretJWTKeyForBlockchainCertVerification2024PleaseChange}
jwt.expiration=86400000

frontend.url=${FRONTEND_URL:http://localhost:5500}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

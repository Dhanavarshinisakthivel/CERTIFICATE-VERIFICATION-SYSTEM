# =====================================================
# Blockchain Certificate Verification System
# application.properties
# =====================================================
spring.application.name=blockchain-cert-system
server.port=8080

# MySQL - change password to your MySQL root password
spring.datasource.url=jdbc:mysql://localhost:3306/cert_verify_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT secret key (change this in production!)
jwt.secret=MyVerySecretJWTKeyForBlockchainCertVerification2024PleaseChange
jwt.expiration=86400000

# Frontend URL for QR codes
frontend.url=http://localhost:5500

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

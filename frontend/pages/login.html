<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — BlockCert</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="bg-mesh"></div>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:420px;">
    <div style="text-align:center;margin-bottom:32px;">
      <a href="../index.html" class="nav-logo" style="justify-content:center;font-size:1.4rem;margin-bottom:12px;display:flex;">
        <div class="logo-icon">⛓</div> BlockCert
      </a>
      <h1 style="font-size:1.6rem;font-weight:800;margin-bottom:6px;">Admin Login</h1>
      <p style="color:var(--muted);font-size:.9rem;">Sign in to the certificate management portal</p>
    </div>

    <div class="card" style="padding:36px;">
      <div id="error-box" class="alert alert-error" style="display:none;margin-bottom:20px;"></div>

      <div style="display:flex;flex-direction:column;gap:20px;">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input id="username" type="text" class="form-control" placeholder="admin" value="admin"/>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input id="password" type="password" class="form-control" placeholder="••••••••"/>
        </div>
        <button id="loginBtn" class="btn btn-primary" style="width:100%;padding:14px;" onclick="doLogin()">
          Sign In
        </button>
      </div>

      <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border);text-align:center;">
        <p style="color:var(--muted);font-size:.85rem;">Default credentials: <code style="color:var(--cyan)">admin / admin123</code></p>
      </div>
    </div>

    <p style="text-align:center;margin-top:20px;color:var(--muted);font-size:.85rem;">
      <a href="../index.html" style="color:var(--blue);text-decoration:none;">← Back to Home</a>
    </p>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
// If already logged in, go to dashboard
if (isLoggedIn()) window.location.href = 'dashboard.html';

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const errBox   = document.getElementById('error-box');
  const btn      = document.getElementById('loginBtn');
  errBox.style.display = 'none';

  if (!username || !password) {
    errBox.textContent = 'Please enter username and password.';
    errBox.style.display = 'flex';
    return;
  }

  setLoading(btn, true);
  try {
    const { status, data } = await AuthAPI.login(username, password);
    if (data.success && data.data.token) {
      localStorage.setItem('admin_token', data.data.token);
      localStorage.setItem('admin_user',  JSON.stringify(data.data));
      showToast('Login successful! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 800);
    } else {
      errBox.textContent = data.message || 'Login failed. Check credentials.';
      errBox.style.display = 'flex';
    }
  } catch(e) {
    errBox.textContent = 'Cannot connect to server. Make sure backend is running on port 8080.';
    errBox.style.display = 'flex';
  }
  setLoading(btn, false);
}

document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
